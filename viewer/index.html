<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RoboBladez Replay Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0e1a; color: #cfd6ff; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  #top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
  #top h1 { font-size: 18px; letter-spacing: 3px; color: #39ffc0; }
  #top .spacer { flex: 1; }
  button { padding: 6px 12px; font-size: 13px; color: #05121a; font-weight: 700; background: linear-gradient(90deg,#39ffc0,#4ad4ff); border: none; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  #scrub { width: 200px; accent-color: #39ffc0; }
  #info { font-size: 13px; color: #8fa0cc; }
  canvas { display: block; width: 100%; height: calc(100vh - 52px); background: radial-gradient(circle at center, #141b30, #0a0e1a); cursor: crosshair; }
  #drop { position: fixed; inset: 52px 0 0 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: rgba(10,14,26,.96); z-index: 10; text-align: center; }
  #drop h2 { letter-spacing: 2px; color: #4ad4ff; }
  #drop p { color: #5f6f9e; font-size: 14px; }
</style>
</head>
<body>
<div id="top">
  <h1>ROBOBLADEZ &nbsp;·&nbsp; REPLAY</h1>
  <span id="info">load a match.json</span>
  <span class="spacer"></span>
  <input type="range" id="scrub" min="0" value="0" />
  <span id="fps">--</span>
  <button id="load">Load match.json</button>
  <button id="play" disabled>Play</button>
</div>
<canvas id="cv"></canvas>
<input type="file" id="file" accept=".json" style="display:none" />
<div id="drop">
  <h2>DROP A match.json</h2>
  <p>Generated by: <code>robobladez demo --out ./out</code> or the season runner.</p>
  <button id="dropbtn">Choose file</button>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const file = document.getElementById('file');
const drop = document.getElementById('drop');
const info = document.getElementById('info');
const scrub = document.getElementById('scrub');
const playBtn = document.getElementById('play');
const fpsEl = document.getElementById('fps');

let match = null;
let roundIdx = 0;
let tick = 0;
let playing = false;

function resize() {
  const r = cv.getBoundingClientRect();
  cv.width = r.width; cv.height = r.height;
}
window.addEventListener('resize', resize);
resize();

function arenaPx() { return Math.min(cv.width, cv.height) * 0.42; }

function loadMatch(obj) {
  match = obj;
  roundIdx = 0; tick = 0; playing = false;
  playBtn.disabled = false;
  playBtn.textContent = 'Play';
  const blades = Object.keys(obj.blades || {});
  info.textContent = `${obj.match_id} · ${blades.join(' vs ')} · winner: ${obj.winner}`;
  drop.style.display = 'none';
  const frames = obj.rounds[roundIdx].frames;
  scrub.max = frames.length - 1;
  scrub.value = 0;
  draw();
}

function frames() {
  if (!match) return [];
  return match.rounds[roundIdx].frames;
}

function draw() {
  if (!match) return;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const R = arenaPx();
  const cx = cv.width / 2, cy = cv.height / 2;

  // arena
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = '#4ad4ff'; ctx.lineWidth = 2; ctx.shadowColor = '#4ad4ff'; ctx.shadowBlur = 18;
  ctx.stroke(); ctx.shadowBlur = 0;
  // center
  ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fillStyle = '#2a3558'; ctx.fill();

  const fr = frames()[Math.min(tick, frames().length - 1)];
  if (!fr) return;

  const scale = R / match.arena.radius;
  const colors = { '#39ffc0': '#39ffc0', '#ff6bff': '#ff6bff' };
  const palette = ['#39ffc0', '#ff6bff', '#ffd166', '#4ad4ff', '#ff5c5c'];
  let i = 0;
  for (const [id, st] of Object.entries(fr.states)) {
    const x = cx + st.pos.x * scale;
    const y = cy - st.pos.y * scale;
    const col = palette[i % palette.length]; i++;
    // blade
    const r = match.arena.radius * 0.05 * scale * (0.9 + (id.length % 3) * 0.1);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
    ctx.font = '11px monospace'; ctx.fillStyle = '#fff';
    ctx.fillText(id, x + r + 4, y + 4);
  }
}

document.getElementById('load').addEventListener('click', () => file.click());
document.getElementById('dropbtn').addEventListener('click', () => file.click());
file.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => loadMatch(JSON.parse(reader.result));
  reader.readAsText(f);
});

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? 'Pause' : 'Play';
});

scrub.addEventListener('input', () => { tick = Number(scrub.value); draw(); });

let last = performance.now();
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  if (playing && match) {
    const fr = frames();
    if (tick < fr.length - 1) {
      tick += Math.round(60 * dt);
      if (tick > fr.length - 1) {
        tick = fr.length - 1;
        if (roundIdx < match.rounds.length - 1) {
          roundIdx++; tick = 0;
          scrub.max = frames().length - 1;
        } else {
          playing = false; playBtn.textContent = 'Play';
        }
      }
      scrub.value = tick;
    }
  }
  fpsEl.textContent = Math.round(1 / Math.max(1e-4, dt)) + ' fps';
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
