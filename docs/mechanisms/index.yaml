# Mechanism Coverage Index

Machine-checkable implementation status for every mechanism. Prevents prose from silently
outrunning runtime (rm8 detailed review §9).

Status enum:
- IDEA — concept only, not documented/specified
- SPECIFIED — fully documented with the mechanism template
- SCAFFOLDED — partial/placeholder implementation
- IMPLEMENTED — runtime code exists
- VERIFIED — implemented + covered by tests

